<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #6ec6ff;
      --sky-mid: #c8ecff;
      --sky-bot: #fff4d6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e2a3a;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .stage {
      width: min(960px, 100%);
      background: #102f40;
      border-radius: 24px;
      padding: 18px 18px 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 6px;
      color: #f4efe4;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    p {
      margin: 0 0 14px;
      color: #9bb8c4;
      font-size: 0.92rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 48%, var(--sky-bot));
    }

    .caption {
      margin-top: 10px;
      color: #7ea0ad;
      font-size: 0.78rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>鹈鹕骑自行车</h1>
    <p>一只大嘴鹈鹕正蹬着单车路过海边公路。</p>
    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5eb8ff"/>
          <stop offset="55%" stop-color="#d7f2ff"/>
          <stop offset="100%" stop-color="#ffe8b0"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#49b3d1"/>
          <stop offset="100%" stop-color="#1f6f8a"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6d6a66"/>
          <stop offset="100%" stop-color="#3f3c39"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fffdf7"/>
          <stop offset="100%" stop-color="#e7e0d0"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb36b"/>
          <stop offset="100%" stop-color="#e06a3a"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffd36a"/>
          <stop offset="100%" stop-color="#f08a2a"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1a3340" flood-opacity="0.18"/>
        </filter>
      </defs>

      <!-- sky -->
      <rect width="960" height="540" fill="url(#sky)"/>

      <!-- sun -->
      <g transform="translate(820,92)">
        <circle r="38" fill="#ffe066"/>
        <circle r="52" fill="#ffe066" opacity="0.18"/>
      </g>

      <!-- distant hills -->
      <path d="M0 290 C120 240, 210 250, 320 275 C430 300, 520 230, 640 255 C760 280, 850 250, 960 270 L960 340 L0 340 Z" fill="#8fbf7a"/>
      <path d="M0 310 C160 280, 280 300, 400 318 C540 340, 680 290, 960 315 L960 360 L0 360 Z" fill="#6ea35f"/>

      <!-- sea -->
      <rect x="0" y="332" width="960" height="58" fill="url(#sea)"/>
      <g>
        <path d="M-200 350 Q-140 340, -80 350 T40 350 T160 350 T280 350 T400 350 T520 350 T640 350 T760 350 T880 350 T1000 350 T1120 350" fill="none" stroke="#d7f7ff" stroke-width="3" opacity="0.55">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="6s" repeatCount="indefinite"/>
        </path>
        <path d="M-200 365 Q-140 357, -80 365 T40 365 T160 365 T280 365 T400 365 T520 365 T640 365 T760 365 T880 365 T1000 365 T1120 365" fill="none" stroke="#b8eaf8" stroke-width="2" opacity="0.4">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-180 0" dur="4.5s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- clouds -->
      <g fill="#ffffff" opacity="0.92">
        <g>
          <ellipse cx="140" cy="80" rx="46" ry="22"/>
          <ellipse cx="175" cy="74" rx="34" ry="20"/>
          <ellipse cx="108" cy="78" rx="28" ry="16"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-1100 0" dur="28s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(420,40)">
          <ellipse cx="140" cy="80" rx="54" ry="24"/>
          <ellipse cx="182" cy="72" rx="36" ry="20"/>
          <ellipse cx="100" cy="78" rx="30" ry="16"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-1300 0" dur="36s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(780,18)">
          <ellipse cx="140" cy="80" rx="40" ry="18"/>
          <ellipse cx="168" cy="76" rx="26" ry="14"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="32s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- roadside plants scrolling -->
      <g>
        <g>
          <g transform="translate(40,360)">
            <rect x="0" y="8" width="8" height="42" fill="#3d7a3a"/>
            <circle cx="4" cy="4" r="16" fill="#4fa04a"/>
          </g>
          <g transform="translate(220,348)">
            <rect x="0" y="16" width="10" height="56" fill="#355f32"/>
            <circle cx="5" cy="8" r="22" fill="#3f8d3c"/>
            <circle cx="-10" cy="18" r="14" fill="#4ea24a"/>
          </g>
          <g transform="translate(430,366)">
            <path d="M8 50 Q4 20, 8 0 Q12 20, 8 50" fill="#5aa84c"/>
            <path d="M8 50 Q-8 28, 2 10" fill="none" stroke="#5aa84c" stroke-width="4"/>
            <path d="M8 50 Q24 26, 16 8" fill="none" stroke="#5aa84c" stroke-width="4"/>
          </g>
          <g transform="translate(640,350)">
            <rect x="0" y="18" width="9" height="52" fill="#355f32"/>
            <circle cx="4" cy="10" r="20" fill="#478f42"/>
          </g>
          <g transform="translate(850,368)">
            <path d="M6 44 Q2 18, 6 0 Q10 18, 6 44" fill="#67b354"/>
            <path d="M6 44 Q-6 24, 0 8" fill="none" stroke="#67b354" stroke-width="3"/>
            <path d="M6 44 Q18 22, 12 6" fill="none" stroke="#67b354" stroke-width="3"/>
          </g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="8s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(960,0)">
          <g transform="translate(40,360)">
            <rect x="0" y="8" width="8" height="42" fill="#3d7a3a"/>
            <circle cx="4" cy="4" r="16" fill="#4fa04a"/>
          </g>
          <g transform="translate(220,348)">
            <rect x="0" y="16" width="10" height="56" fill="#355f32"/>
            <circle cx="5" cy="8" r="22" fill="#3f8d3c"/>
            <circle cx="-10" cy="18" r="14" fill="#4ea24a"/>
          </g>
          <g transform="translate(430,366)">
            <path d="M8 50 Q4 20, 8 0 Q12 20, 8 50" fill="#5aa84c"/>
            <path d="M8 50 Q-8 28, 2 10" fill="none" stroke="#5aa84c" stroke-width="4"/>
            <path d="M8 50 Q24 26, 16 8" fill="none" stroke="#5aa84c" stroke-width="4"/>
          </g>
          <g transform="translate(640,350)">
            <rect x="0" y="18" width="9" height="52" fill="#355f32"/>
            <circle cx="4" cy="10" r="20" fill="#478f42"/>
          </g>
          <g transform="translate(850,368)">
            <path d="M6 44 Q2 18, 6 0 Q10 18, 6 44" fill="#67b354"/>
            <path d="M6 44 Q-6 24, 0 8" fill="none" stroke="#67b354" stroke-width="3"/>
            <path d="M6 44 Q18 22, 12 6" fill="none" stroke="#67b354" stroke-width="3"/>
          </g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="8s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- road -->
      <rect x="0" y="418" width="960" height="122" fill="url(#road)"/>
      <rect x="0" y="418" width="960" height="8" fill="#8a867f"/>
      <g stroke="#f2e38a" stroke-width="8" stroke-dasharray="48 36" stroke-linecap="butt">
        <line x1="-200" y1="478" x2="2000" y2="478">
          <animate attributeName="x1" values="-200;-92" dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="2000;2108" dur="0.7s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- rider group -->
      <g filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.7s" repeatCount="indefinite"/>

        <!-- shadow -->
        <ellipse cx="470" cy="508" rx="118" ry="12" fill="#1a1a1a" opacity="0.28">
          <animate attributeName="rx" values="118;108;118" dur="0.7s" repeatCount="indefinite"/>
        </ellipse>

        <!-- bicycle -->
        <g transform="translate(470,430)">
          <!-- rear wheel -->
          <g transform="translate(-92,42)">
            <circle r="42" fill="none" stroke="#222" stroke-width="7"/>
            <circle r="8" fill="#333"/>
            <g stroke="#555" stroke-width="2">
              <line x1="0" y1="-36" x2="0" y2="36"/>
              <line x1="-36" y1="0" x2="36" y2="0"/>
              <line x1="-25" y1="-25" x2="25" y2="25"/>
              <line x1="25" y1="-25" x2="-25" y2="25"/>
            </g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
          </g>

          <!-- front wheel -->
          <g transform="translate(98,42)">
            <circle r="42" fill="none" stroke="#222" stroke-width="7"/>
            <circle r="8" fill="#333"/>
            <g stroke="#555" stroke-width="2">
              <line x1="0" y1="-36" x2="0" y2="36"/>
              <line x1="-36" y1="0" x2="36" y2="0"/>
              <line x1="-25" y1="-25" x2="25" y2="25"/>
              <line x1="25" y1="-25" x2="-25" y2="25"/>
            </g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
          </g>

          <!-- frame -->
          <g fill="none" stroke="#1f7a72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-92 42 L-18 42 L18 -18 L-40 -18 Z"/>
            <path d="M-18 42 L18 -18"/>
            <path d="M18 -18 L98 42"/>
            <path d="M18 -18 L42 -46"/>
          </g>
          <circle cx="-18" cy="42" r="7" fill="#163e3b"/>
          <rect x="-52" y="-28" width="28" height="10" rx="4" fill="#163e3b"/>
          <!-- handlebar -->
          <path d="M42 -46 C58 -58, 78 -50, 86 -38" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
          <circle cx="86" cy="-38" r="5" fill="#c45c26"/>

          <!-- chainring + pedals -->
          <g transform="translate(-18,42)">
            <circle r="14" fill="none" stroke="#333" stroke-width="4"/>
            <g>
              <rect x="-5" y="-28" width="10" height="56" rx="4" fill="#2b2b2b"/>
              <rect x="-16" y="-34" width="32" height="10" rx="3" fill="#c45c26"/>
              <rect x="-16" y="24" width="32" height="10" rx="3" fill="#c45c26"/>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
            </g>
          </g>
        </g>

        <!-- pelican -->
        <g transform="translate(452,318)">
          <!-- tail -->
          <path d="M-70 42 Q-108 28, -118 8 Q-92 22, -74 18 Z" fill="#d9d1c0"/>

          <!-- far wing -->
          <g transform="translate(-8,18)">
            <path d="M0 0 Q-20 -38, 18 -62 Q8 -20, 22 -4 Z" fill="#cfc6b4"/>
            <animateTransform attributeName="transform" type="rotate" values="-8;-22;-8" dur="0.7s" repeatCount="indefinite" additive="sum"/>
          </g>

          <!-- body -->
          <ellipse cx="-8" cy="38" rx="62" ry="40" fill="url(#bodyGrad)"/>
          <ellipse cx="-18" cy="48" rx="38" ry="22" fill="#f4eee2" opacity="0.7"/>

          <!-- near wing -->
          <g transform="translate(10,22)">
            <path d="M0 8 Q36 -10, 78 -6 Q48 18, 12 28 Z" fill="#efe7d6"/>
            <path d="M18 16 Q48 8, 70 10" fill="none" stroke="#d2c7b2" stroke-width="3"/>
            <animateTransform attributeName="transform" type="rotate" values="6;18;6" dur="0.7s" repeatCount="indefinite" additive="sum"/>
          </g>

          <!-- neck -->
          <path d="M18 18 C38 -8, 58 -18, 78 -8" fill="none" stroke="#f4efe4" stroke-width="22" stroke-linecap="round"/>
          <path d="M18 18 C38 -8, 58 -18, 78 -8" fill="none" stroke="#fffdf8" stroke-width="14" stroke-linecap="round"/>

          <!-- head -->
          <g transform="translate(92,-10)">
            <animateTransform attributeName="transform" type="rotate" values="-4;3;-4" dur="0.7s" repeatCount="indefinite" additive="sum"/>
            <ellipse cx="0" cy="0" rx="28" ry="24" fill="#fffdf8"/>
            <!-- eye -->
            <circle cx="8" cy="-4" r="6" fill="#1c1c1c"/>
            <circle cx="10" cy="-6" r="2" fill="#fff"/>
            <!-- crest -->
            <path d="M-16 -16 Q-8 -34, 8 -22" fill="none" stroke="#e7dcc8" stroke-width="6" stroke-linecap="round"/>
            <!-- upper beak -->
            <path d="M18 -6 L86 4 L22 10 Z" fill="url(#beakGrad)"/>
            <!-- pouch -->
            <g>
              <path d="M20 8 Q52 62, 88 10 Q58 18, 22 12 Z" fill="url(#pouchGrad)"/>
              <path d="M28 18 Q54 42, 78 16" fill="none" stroke="#c75b2e" stroke-width="2" opacity="0.45"/>
              <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="0.7s" repeatCount="indefinite"/>
            </g>
            <!-- beak tip -->
            <path d="M80 2 L98 8 L80 10 Z" fill="#d4551f"/>
          </g>

          <!-- legs to pedals -->
          <g stroke="#e7a24a" stroke-width="8" stroke-linecap="round" fill="none">
            <path d="M-6 70 Q-10 92, -18 114">
              <animate attributeName="d" values="M-6 70 Q-10 92, -18 114; M-6 70 Q8 88, 8 108; M-6 70 Q-10 92, -18 114" dur="0.7s" repeatCount="indefinite"/>
            </path>
            <path d="M10 72 Q18 90, 8 108">
              <animate attributeName="d" values="M10 72 Q18 90, 8 108; M10 72 Q-4 94, -18 114; M10 72 Q18 90, 8 108" dur="0.7s" repeatCount="indefinite"/>
            </path>
          </g>
          <!-- webbed feet -->
          <g fill="#e08a32">
            <ellipse cx="-18" cy="118" rx="12" ry="6">
              <animate attributeName="cx" values="-18;8;-18" dur="0.7s" repeatCount="indefinite"/>
              <animate attributeName="cy" values="118;108;118" dur="0.7s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="8" cy="108" rx="12" ry="6">
              <animate attributeName="cx" values="8;-18;8" dur="0.7s" repeatCount="indefinite"/>
              <animate attributeName="cy" values="108;118;108" dur="0.7s" repeatCount="indefinite"/>
            </ellipse>
          </g>
        </g>
      </g>
    </svg>
    <div class="caption">SVG SMIL · 打开文件即可播放</div>
  </div>
</body>
</html>
